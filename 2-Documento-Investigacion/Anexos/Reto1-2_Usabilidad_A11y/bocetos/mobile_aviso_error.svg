<svg viewBox="0 0 375 900" xmlns="http://www.w3.org/2000/svg" width="375" height="900">
<rect x="0" y="0" width="375" height="900" fill="#ffffff"/>
<rect x="8" y="8" width="359" height="796" rx="24" fill="none" stroke="#333333" stroke-width="2"/>

<polygon points="187,300 148,375 226,375" fill="none" stroke="#111111" stroke-width="3" stroke-linejoin="round"/>
<line x1="187" y1="325" x2="187" y2="350" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
<circle cx="187" cy="362" r="2.5" fill="#111111"/>

<text x="187" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#111111">Sin conexión</text>
<text x="187" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555555">Tu publicación se guardó y</text>
<text x="187" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555555">se enviará cuando vuelva la señal</text>

<rect x="90" y="510" width="195" height="48" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
<text x="187" y="539" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#111111">Reintentar</text>

<line x1="30" y1="770" x2="345" y2="770" stroke="#cccccc" stroke-dasharray="3,3"/>
<text x="187" y="800" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#999999">Nota: se lee igual en escala</text>
<text x="187" y="818" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#999999">de grises — forma y tamaño</text>
<text x="187" y="836" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#999999">comunican, no el color</text>
</svg>
